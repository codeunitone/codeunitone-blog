{{ define "main" }}
<section class="posts-section">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ with .Content }}
  <div class="page-content">{{ . }}</div>
  {{ end }}
  <ul class="posts-list">
    {{ range .Pages }}
    <li class="post-item">
      <span class="post-date">{{ .Date.Format "Jan 02, 2006" }}</span>
      <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
