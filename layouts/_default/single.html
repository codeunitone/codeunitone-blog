{{ define "main" }}
<div class="article-wrapper">
  <article class="post-single post-card">
    <header class="post-header">
      <nav class="post-back-nav" style="margin-bottom: 1rem;">
        <a href="{{ site.Home.RelPermalink }}" style="text-decoration: none; font-weight: 600;">&larr; Back to Home</a>
      </nav>
      <h1 class="post-title">{{ .Title }}</h1>
      <div class="post-meta">
        {{ if not .Date.IsZero }}
        <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "January 02, 2006" }}</time>
        {{ end }}
        {{ if .WordCount }}
        <span class="separator">&middot;</span>
        <span class="reading-time">{{ .ReadingTime }} min read</span>
        {{ end }}
      </div>
    </header>
    
    <div class="post-content">
      {{ .Content }}
    </div>

    {{ with .Params.tags }}
    <footer class="post-single-footer">
      <div class="post-tags">
        {{ range . }}
        {{ if . }}
        <span class="tag">#{{ . }}</span>
        {{ end }}
        {{ end }}
      </div>
    </footer>
    {{ end }}
  </article>
</div>
{{ end }}
