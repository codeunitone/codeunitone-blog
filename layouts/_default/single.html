{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ if not .Date.IsZero }}
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "Jan 02, 2006" }}</time>
      {{ with .Params.tags }}
      <span class="post-tags">
        {{ range . }}
        {{ if . }}
        <span class="tag">#{{ . }}</span>
        {{ end }}
        {{ end }}
      </span>
      {{ end }}
    </div>
    {{ end }}
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
